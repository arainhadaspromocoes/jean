<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jean Ligeiro 🤴 | O Imperador das Promoções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --azul:#2E3894;
    --tinta:#15151F;
    --papel:#F2F1EA;
    --amarelo:#F5C518;
    --lilas:#6FA1E8;
    --verde:#4BC47D;
    --rosa:#E8552E;
    --rosa-claro:#FFC08A;
    --borda:2.4px solid var(--tinta);
    --sombra-g:6px 6px 0 0 var(--tinta);
    --sombra-m:4px 4px 0 0 var(--tinta);
    --sombra-p:2px 2px 0 0 var(--tinta);
    --raio:12px;
    --raio-btn:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background-color:var(--azul);
    background-image:
      linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
    background-size:30px 30px;
    color:var(--tinta);
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  .estrela{position:fixed;font-size:26px;z-index:0;pointer-events:none;opacity:.95;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .e1{top:9%;left:5%}.e2{top:22%;right:6%;font-size:32px}.e3{bottom:18%;left:7%}.e4{bottom:30%;right:5%;font-size:20px}

  .container{max-width:560px;margin:0 auto;padding:22px 16px 40px;position:relative;z-index:1}

  .janela{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-g);overflow:hidden;margin-bottom:20px;
  }
  .barra{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:var(--borda);
    font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  }
  .barra-lilas{background:var(--lilas)}
  .barra-verde{background:var(--verde)}
  .barra-amarela{background:var(--amarelo)}
  .barra-rosa{background:var(--rosa-claro)}
  .barra .controles{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;opacity:.85}
  .janela .corpo{padding:16px}

  .hero-titulo{text-align:center;font-weight:700;color:var(--azul);font-size:30px;line-height:1.25;letter-spacing:.5px}
  .marca-texto{
    display:inline-block;background:var(--amarelo);color:var(--azul);
    padding:2px 12px;border-radius:10px;box-shadow:3px 3px 0 0 var(--tinta);
  }
  .hero-sub{text-align:center;font-size:14.5px;margin-top:12px;line-height:1.5}
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--papel);border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-m);font-size:12.5px;font-weight:700;padding:8px 12px;
  }
  .chip-amarelo{background:var(--amarelo)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:var(--borda);border-radius:var(--raio-btn);box-shadow:var(--sombra-m);
    font-size:14px;font-weight:700;padding:11px 16px;
    transition:transform .1s, box-shadow .1s;background:var(--papel);
  }
  .btn:active{transform:translate(3px,3px);box-shadow:var(--sombra-p)}
  .btn-amarelo{background:var(--amarelo)}
  .btn-lilas{background:var(--lilas)}
  .btn-verde{background:var(--verde)}
  .btn-rosa{background:var(--rosa-claro);color:#7A3300}
  .btn-bloco{width:100%}
  .btn-mini{padding:7px 11px;font-size:12.5px;box-shadow:var(--sombra-p)}
  .btn-mini:active{transform:translate(2px,2px);box-shadow:none}

  /* Cupom em destaque */
  .use-cupom{font-size:28px;font-weight:700;letter-spacing:1.5px;color:var(--azul)}
  .caixa-cupom{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:2.4px dashed var(--tinta);border-radius:10px;background:#fff;
    padding:8px 8px 8px 16px;margin-top:12px;
  }
  .codigo-cupom{font-weight:700;font-size:20px;letter-spacing:1.5px;word-break:break-all}

  /* Aviso do link */
  .aviso-texto{
    font-size:17px;font-weight:700;line-height:1.55;text-align:center;
  }
  .aviso-texto .destaque{
    background:var(--rosa);color:#fff;padding:1px 8px;border-radius:8px;
    box-shadow:2px 2px 0 0 var(--tinta);white-space:nowrap;
  }
  .aviso-sub{font-size:13.5px;font-weight:600;text-align:center;margin-top:10px;opacity:.85}

  .titulo-secao{
    color:#fff;font-size:19px;font-weight:700;margin:6px 0 14px;
    text-shadow:2px 2px 0 rgba(0,0,0,.3);
  }

  /* Categorias */
  .card-categoria{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-m);overflow:hidden;margin-bottom:16px;
  }
  .card-categoria .barra{font-size:10.5px;padding:5px 9px}
  .card-categoria .barra .controles{font-size:10.5px;gap:5px}
  .card-categoria .corpo{padding:14px;display:flex;flex-direction:column;gap:9px}
  .card-categoria .nome{font-size:17px;font-weight:700;text-align:center;line-height:1.35}
  .btn-cupom{
    display:block;width:100%;text-align:center;
    border:2px dashed var(--tinta);border-radius:8px;background:#fff;
    font-weight:700;font-size:12px;padding:8px 0;letter-spacing:.5px;
    transition:transform .1s;
  }
  .btn-cupom:active{transform:scale(.97)}
  .btn-ir{
    display:block;text-align:center;background:var(--lilas);
    border:var(--borda);border-radius:var(--raio-btn);box-shadow:var(--sombra-p);
    font-size:14px;font-weight:700;padding:11px 0;
    transition:transform .1s, box-shadow .1s;
  }
  .btn-ir:active{transform:translate(2px,2px);box-shadow:none}

  .vazio{text-align:center;padding:36px 20px;font-size:14.5px;font-weight:500}
  .vazio .emoji{font-size:44px;margin-bottom:12px}

  .rodape{
    text-align:center;padding:10px 16px 110px;font-size:13px;color:#fff;font-weight:600;
    text-shadow:1px 1px 0 rgba(0,0,0,.3);position:relative;z-index:1;
  }
  .icone-insta{width:15px;height:15px;flex-shrink:0}
  .rodape a{text-decoration:underline;text-underline-offset:3px}

  /* Admin */
  .painel-secao{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-g);margin-bottom:20px;overflow:hidden;
  }
  .painel-secao .conteudo{padding:16px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:12px;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .campo input{
    width:100%;padding:11px 12px;font-size:14px;font-weight:500;
    border:var(--borda);border-radius:var(--raio-btn);
    outline:none;background:#fff;color:var(--tinta);transition:box-shadow .1s;
  }
  .campo input:focus{box-shadow:var(--sombra-p)}
  .campo input::placeholder{color:#999;font-weight:400}

  .linha-cat{
    display:flex;align-items:center;gap:10px;
    padding:10px 0;border-bottom:2px dashed #d8d6c9;
  }
  .linha-cat:last-child{border-bottom:none}
  .linha-cat .nome{flex:1;font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acoes{display:flex;gap:6px;flex-shrink:0}
  .btn-icone{
    width:32px;height:32px;border:2px solid var(--tinta);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;background:#fff;box-shadow:var(--sombra-p);
    transition:transform .1s, box-shadow .1s;
  }
  .btn-icone:active{transform:translate(2px,2px);box-shadow:none}
  .btn-icone.perigo{background:var(--rosa-claro);color:#7A3300}

  .caixa-add{background:#fff;border:2px dashed var(--tinta);border-radius:var(--raio-btn);padding:12px;margin-top:12px}

  .zap-flutuante{
    position:fixed;bottom:18px;right:14px;z-index:150;
    display:inline-flex;align-items:center;gap:7px;
    background:#25D366;color:var(--tinta);
    border:2.4px solid var(--tinta);border-radius:100px;box-shadow:var(--sombra-m);
    font-weight:700;font-size:13.5px;padding:12px 18px;
    transition:transform .1s, box-shadow .1s;
  }
  .zap-flutuante:active{transform:translate(2px,2px);box-shadow:var(--sombra-p)}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--tinta);color:#fff;font-size:13.5px;font-weight:700;
    padding:11px 20px;border-radius:100px;border:2px solid #fff;box-shadow:var(--sombra-m);
    opacity:0;transition:all .3s;z-index:200;white-space:nowrap;
  }
  .toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0)}

  .senha-box{max-width:360px;margin:60px auto 0;padding:0 16px;position:relative;z-index:1}
  .senha-box .corpo{text-align:center;padding:22px 18px}
  .senha-box .cadeado{font-size:40px;margin-bottom:10px}
  .senha-box h2{font-size:18px;font-weight:700;margin-bottom:16px}

  @media(max-width:380px){.hero-titulo{font-size:25px}}
</style><style>
  /* extras da bio */
  .foto-perfil{
    width:140px;height:140px;border-radius:50%;object-fit:cover;
    border:3px solid var(--tinta);box-shadow:var(--sombra-m);
    display:block;margin:0 auto 14px;background:#fff;
  }
  .botao-bio{
    display:flex;align-items:center;gap:12px;
    border:var(--borda);border-radius:14px;box-shadow:5px 5px 0 0 var(--tinta);
    padding:17px 18px;margin-bottom:16px;
    font-size:15.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    transition:transform .12s, box-shadow .12s;
  }
  .botao-bio:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--tinta)}
  .botao-bio:active{transform:translate(4px,4px);box-shadow:1px 1px 0 0 var(--tinta)}
  .botao-bio .icone{font-size:22px;flex-shrink:0;filter:drop-shadow(1.5px 1.5px 0 rgba(0,0,0,.2))}
  .botao-bio .texto{flex:1;text-align:center;line-height:1.25}
  .botao-bio .seta{font-weight:700;font-size:17px;flex-shrink:0}
  .cor-0{background:var(--amarelo)}
  .cor-1{background:var(--verde)}
  .cor-2{background:var(--lilas)}
  .cor-3{background:var(--rosa-claro)}
</style>
</head>
<body>
<span class="estrela e1">✨</span>
<span class="estrela e2">⭐</span>
<span class="estrela e3">💫</span>
<span class="estrela e4">⭐</span>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ================================================================
   BIO — Jean Ligeiro / O Imperador das Promoções (link da bio do Instagram)
   - Página:  #/     - Painel:  #/admin
   Dados: documento lives/_biojean no Firestore (projeto lives-da-rainha)
   ================================================================ */

const ADMIN_EMAILS = ["vpthais@gmail.com", "jeanligeiro4@hotmail.com"];
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6qO04sAW0nPFKg_z40CRXGAC0x4E70dE",
  authDomain: "lives-da-rainha.firebaseapp.com",
  projectId: "lives-da-rainha",
  storageBucket: "lives-da-rainha.firebasestorage.app",
  messagingSenderId: "85874306516",
  appId: "1:85874306516:web:91c45fcfcb65ed602cba41"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch(e){}
const auth = firebase.auth();
const DOC = db.collection("lives").doc("_biojean");
const CORES_BARRA = ["barra-amarela","barra-verde","barra-lilas","barra-rosa"];

/* ---------- DADOS (tempo real + reservas) ---------- */
let dados = null;
let tempoRealOk = false;
const CHAVE_CACHE = "biojean_cache_v1";
function guardarCache(){ try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(dados)); } catch(e){} }
try {
  const c = JSON.parse(localStorage.getItem(CHAVE_CACHE) || "null");
  if (c && typeof c === "object") dados = c;
} catch(e){}

DOC.onSnapshot(function(snap){
  tempoRealOk = true;
  dados = snap.exists ? snap.data() : {};
  guardarCache();
  rota();
}, function(err){
  console.error(err);
  if (dados === null) carregarViaRest();
});

function valorRest(v){
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valorRest);
  if ("mapValue" in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = valorRest(f[k]); return o; }
  return null;
}
let buscandoRest = false;
function carregarViaRest(){
  if (buscandoRest || tempoRealOk) return;
  buscandoRest = true;
  fetch("https://firestore.googleapis.com/v1/projects/" + FIREBASE_CONFIG.projectId +
        "/databases/(default)/documents/lives/_biojean?key=" + FIREBASE_CONFIG.apiKey)
    .then(r => r.json())
    .then(function(j){
      buscandoRest = false;
      if (tempoRealOk) return;
      const obj = {}, f = j.fields || {};
      for (const k in f) obj[k] = valorRest(f[k]);
      dados = obj;
      guardarCache();
      rota();
    })
    .catch(function(){ buscandoRest = false; });
}
setTimeout(function(){ if (!tempoRealOk) carregarViaRest(); }, 5000);
setInterval(function(){ if (!tempoRealOk && dados === null) carregarViaRest(); }, 12000);

/* ---------- UTILITÁRIOS ---------- */
function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("mostrar");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("mostrar"), 2200);
}
function controles(){ return `<span class="controles"><span>○</span><span>─</span><span>✕</span></span>`; }
function erroEscrita(err){
  console.error(err);
  toast(err && err.code === "permission-denied" ? "Sem permissão 🔒" : "Erro ao salvar 😕");
}
function salvarDoc(mudancas, msg){
  DOC.set(mudancas, { merge: true }).then(()=>{ if (msg) toast(msg); }).catch(erroEscrita);
}
function botoes(){ return (dados && dados.botoes) || []; }

/* ---------- SESSÃO ADMIN ---------- */
let usuario = null;
let authPronto = false;
auth.onAuthStateChanged(function(u){
  usuario = u;
  authPronto = true;
  if ((location.hash||"").startsWith("#/admin")) rota();
});
function entrarComGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(err){
    if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) {
      auth.signInWithRedirect(provider);
    } else if (err && err.code !== "auth/popup-closed-by-user") {
      console.error(err);
      toast("Não consegui entrar 😕");
    }
  });
}
function sair(){ auth.signOut().then(()=>rota()); }

/* ---------- ROTEADOR ---------- */
function rota(){
  const app = document.getElementById("app");
  window.scrollTo(0,0);
  if ((location.hash||"").startsWith("#/admin")) telaAdmin(app);
  else telaHome(app);
}
window.addEventListener("hashchange", rota);
document.addEventListener("click", function(e){
  const a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if (!a) return;
  e.preventDefault();
  const destino = a.getAttribute("href");
  if (location.hash === destino) rota();
  else location.hash = destino;
});

/* ================= TELA: BIO ================= */
function emojiBotao(nome){
  const n = String(nome||"").toLowerCase();
  if (n.includes("direct")) return "\uD83D\uDCE9";
  if (n.includes("instagram")) return "\uD83D\uDCF8";
  if (n.includes("whatsapp")) return "\uD83D\uDCAC";
  if (n.includes("telegram")) return "\u2708\uFE0F";
  if (n.includes("natura")) return "\uD83C\uDF3F";
  if (n.includes("shopee")) return "\uD83D\uDECD\uFE0F";
  if (n.includes("mercado livre")) return "\uD83D\uDED2";
  if (n.includes("cupo")) return "\uD83C\uDF9F\uFE0F";
  return "\u2B50";
}
function telaHome(app){
  if (dados === null) {
    app.innerHTML = `<div class="container">
      <div class="janela"><div class="barra barra-amarela"><span>🤴 O Imperador das Promoções</span>${controles()}</div>
      <div class="vazio"><div class="emoji">⏳</div>Carregando...</div></div></div>`;
    return;
  }
  const nome = dados.nome || "JEAN LIGEIRO";
  const arroba = dados.arroba || "@imperadordaspromocoes";
  const cards = botoes().map((b, i) => `
    <a class="botao-bio cor-${i % 4}" href="${esc(b.url)}" target="_blank" rel="noopener">
      <span class="icone">${emojiBotao(b.nome)}</span>
      <span class="texto">${esc(b.nome)}</span>
      <span class="seta">↗</span>
    </a>`).join("");

  app.innerHTML = `
    <div class="container">
      <div class="janela">
        <div class="barra barra-lilas"><span>🤴 O Imperador das Promoções</span>${controles()}</div>
        <div class="corpo" style="padding:24px 16px 20px;text-align:center">
          ${dados.foto ? `<img class="foto-perfil" src="${esc(dados.foto)}" alt="${esc(nome)}">` : ""}
          <div class="hero-titulo">${esc(nome)}</div>
          <div class="hero-sub" style="margin-top:4px;font-weight:700">${esc(arroba)}</div>
        </div>
      </div>
      ${cards || `<div class="janela"><div class="vazio"><div class="emoji">🔗</div>Os links aparecem aqui daqui a pouco!</div></div>`}
    </div>
    <div class="rodape" style="padding-bottom:30px">Feito com 💛 · <a href="#/admin" title="Painel de edição">🔐</a></div>`;
}

/* ================= TELA: ADMIN ================= */
let botaoEditando = null;
let fotoNova = "";

function telaAdmin(app){
  if (!authPronto || dados === null) {
    app.innerHTML = `<div class="container"><div class="janela">
      <div class="barra barra-amarela"><span>🤴 Painel</span>${controles()}</div>
      <div class="vazio"><div class="emoji">⏳</div>Carregando...</div></div></div>`;
    return;
  }
  if (!usuario) {
    app.innerHTML = `
      <div class="senha-box"><div class="janela">
        <div class="barra barra-rosa"><span>🔐 Área do Imperador</span>${controles()}</div>
        <div class="corpo">
          <div class="cadeado">🤴</div>
          <h2>Só a Thais entra aqui!</h2>
          <button class="btn btn-amarelo btn-bloco" onclick="entrarComGoogle()">Entrar com Google</button>
          <div style="margin-top:14px"><a href="#/" style="font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px">◀ voltar</a></div>
        </div>
      </div></div>`;
    return;
  }
  if (!ADMIN_EMAILS.includes(String(usuario.email||"").toLowerCase())) {
    app.innerHTML = `
      <div class="senha-box"><div class="janela">
        <div class="barra barra-rosa"><span>🔐 Área do Imperador</span>${controles()}</div>
        <div class="corpo">
          <div class="cadeado">🚫</div>
          <h2>Essa conta não tem permissão</h2>
          <button class="btn btn-amarelo btn-bloco" onclick="sair()">Sair e trocar de conta</button>
        </div>
      </div></div>`;
    return;
  }

  const bts = botoes();
  const linhas = bts.map(function(b, i){
    if (botaoEditando === i) {
      return `
      <div class="caixa-add" style="margin:10px 0">
        <div class="campo"><label>Nome do botão</label>
          <input id="ed-b-nome" value="${esc(b.nome)}"></div>
        <div class="campo"><label>Link</label>
          <input id="ed-b-url" value="${esc(b.url)}"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-verde btn-mini" onclick="salvarEdicaoBotao(${i})">💾 Salvar</button>
          <button class="btn btn-mini" onclick="botaoEditando=null;rota()">Cancelar</button>
        </div>
      </div>`;
    }
    return `
    <div class="linha-cat">
      <div class="nome">${esc(b.nome)}</div>
      <div class="acoes">
        <button class="btn-icone" title="Jogar pro topo" onclick="botaoProTopo(${i})" style="background:var(--amarelo)">⤒</button>
        <button class="btn-icone" title="Editar" onclick="botaoEditando=${i};rota()">✎</button>
        <button class="btn-icone" title="Subir" onclick="moverBotao(${i},-1)">↑</button>
        <button class="btn-icone" title="Descer" onclick="moverBotao(${i},1)">↓</button>
        <button class="btn-icone perigo" title="Remover" onclick="removerBotao(${i})">✕</button>
      </div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="container">
      <div class="janela">
        <div class="barra barra-rosa"><span>🔐 Painel da Bio do Jean</span>${controles()}</div>
        <div class="corpo" style="padding:12px 16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:500">Oi, Thais! 👋</div>
            <div style="display:flex;gap:8px">
              <a class="btn btn-mini" href="#/">◀ Ver a bio</a>
              <button class="btn btn-mini" onclick="sair()">Sair</button>
            </div>
          </div>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-amarela"><span>🖼️ Foto e nome</span>${controles()}</div>
        <div class="conteudo">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
            <img id="foto-atual" src="${esc(fotoNova || dados.foto || "")}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--tinta);background:#fff">
            <div>
              <input id="arq-foto" type="file" accept="image/*" style="display:none" onchange="fotoEscolhida(this)">
              <button class="btn btn-lilas btn-mini" onclick="document.getElementById('arq-foto').click()">📷 Trocar foto</button>
            </div>
          </div>
          <div class="campo"><label>Nome</label>
            <input id="cfg-nome" value="${esc(dados.nome || "")}"></div>
          <div class="campo"><label>@ (arroba)</label>
            <input id="cfg-arroba" value="${esc(dados.arroba || "")}"></div>
          <button class="btn btn-amarelo btn-bloco" onclick="salvarPerfil()">💾 Salvar perfil</button>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-lilas"><span>🔗 Botões (${bts.length})</span>${controles()}</div>
        <div class="conteudo">
          ${bts.length ? linhas : `<div style="font-size:13.5px;font-weight:500">Nenhum botão ainda. 👇</div>`}
          <div class="caixa-add">
            <div class="campo"><label>Nome do botão</label>
              <input id="nb-nome" placeholder="Ex.: GRUPO WHATSAPP"></div>
            <div class="campo"><label>Link</label>
              <input id="nb-url" placeholder="https://..."></div>
            <button class="btn btn-amarelo btn-bloco" onclick="adicionarBotao()">Adicionar botão ✨</button>
          </div>
        </div>
      </div>
    </div>`;
}

function fotoEscolhida(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    const img = new Image();
    img.onload = function(){
      const c = document.createElement("canvas");
      c.width = 300; c.height = 300;
      const lado = Math.min(img.width, img.height);
      const sx = (img.width - lado) / 2, sy = (img.height - lado) / 2;
      c.getContext("2d").drawImage(img, sx, sy, lado, lado, 0, 0, 300, 300);
      fotoNova = c.toDataURL("image/jpeg", 0.8);
      document.getElementById("foto-atual").src = fotoNova;
      toast("Foto pronta — toca em Salvar perfil 📷");
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
  input.value = "";
}
function salvarPerfil(){
  const mud = {
    nome: document.getElementById("cfg-nome").value.trim(),
    arroba: document.getElementById("cfg-arroba").value.trim()
  };
  if (fotoNova) mud.foto = fotoNova;
  fotoNova = "";
  salvarDoc(mud, "Perfil salvo ✅");
}
function adicionarBotao(){
  const nome = document.getElementById("nb-nome").value.trim();
  const url = document.getElementById("nb-url").value.trim();
  if (!nome) { toast("Dê um nome pro botão ✍️"); return; }
  if (!url) { toast("Cole o link 🔗"); return; }
  salvarDoc({ botoes: botoes().concat([{ nome, url }]) }, "Botão adicionado ✨");
}
function salvarEdicaoBotao(i){
  const nome = document.getElementById("ed-b-nome").value.trim();
  const url = document.getElementById("ed-b-url").value.trim();
  if (!nome || !url) { toast("Preencha nome e link"); return; }
  const bts = botoes().slice();
  bts[i] = { nome, url };
  botaoEditando = null;
  salvarDoc({ botoes: bts }, "Botão atualizado ✅");
}
function removerBotao(i){
  const bts = botoes().slice();
  bts.splice(i, 1);
  salvarDoc({ botoes: bts }, "Botão removido");
}
function moverBotao(i, dir){
  const bts = botoes().slice();
  const j = i + dir;
  if (j < 0 || j >= bts.length) return;
  const tmp = bts[i]; bts[i] = bts[j]; bts[j] = tmp;
  salvarDoc({ botoes: bts }, null);
}
function botaoProTopo(i){
  if (i === 0) return;
  const bts = botoes().slice();
  const b = bts.splice(i, 1)[0];
  bts.unshift(b);
  salvarDoc({ botoes: bts }, "Jogado pro topo ⤒");
}

/* ---------- INICIAR ---------- */
rota();
</script>
</body>
</html>
